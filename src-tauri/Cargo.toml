[package]
name = "claude-manager"
version = "0.1.0"
description = "Desktop app to review, accept, reject, and rollback Claude Code edits"
license = "Apache-2.0"
repository = "https://github.com/theanh1810/claude-manager"
edition = "2021"
rust-version = "1.90"

[[bin]]
name = "claude-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-autostart = "2.0"
tauri-plugin-dialog = "2.0"
walkdir = "2"
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
parking_lot = "0.12"
directories = "5"
notify = "6"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
tempfile = "3"

[features]
default = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
